# PixGamma Photo v3: 4x-UltraSharpV2 (Kim2091, DAT2, CC-BY-NC-SA-4.0) train tiếp trên dữ liệu của PixGamma.
# UltraSharpV2 giống gốc nhất trên ảnh sạch (8 ảnh thu nhỏ một nửa rồi phóng 2x: 36,3 dB, SSIM 0,976)
# nhưng tệ nhất trên ảnh web nén (40 ảnh giữ lại: DISTS 0,177 so với 0,164 của Photo v2, hf 15 vì phóng
# to cả khối JPEG). Mục tiêu v3: giữ độ trung thực trên ảnh sạch, hết khuếch đại khối nén.
# Dữ liệu: photo1 (ảnh web bị nén, mờ, nhiễu) + photo_clean (4.000 ô chỉ thu nhỏ bicubic) + ô chữ.
# Loss như Photo v1, DISTS 0,25, không GAN. Giấy phép model ra: CC-BY-NC-SA-4.0, ghi công Kim2091.
#   .venv/bin/python ../train_mps.py -opt ../configs/photo3_us2.yml
name: pixgamma_photo3_us2
scale: 4
use_amp: false
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: 0              # patch MPS: num_gpu 0 + TRAINNER_MPS=1 → chạy trên GPU Mac
manual_seed: 2510

datasets:
  train:
    name: photo
    type: pairedimagedataset
    dataroot_gt: [../datasets/photo1/train/hr, ../datasets/photo_clean/hr, ../datasets/text_mix/hr]
    dataroot_lq: [../datasets/photo1/train/lr, ../datasets/photo_clean/lr, ../datasets/text_mix/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 6
    accum_iter: 1
    prefetch_mode: ~
  val:
    name: photo_val
    type: pairedimagedataset
    dataroot_gt: [../datasets/photo1/val_small/hr]
    dataroot_lq: [../datasets/photo1/val_small/lr]

network_g:
  type: dat_2

path:
  pretrain_network_g: ../../tools/weights/candidates/4x-UltraSharpV2.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: experiments/pixgamma_photo3_us2/training_states/9000.state

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [11000]
    gamma: 0.5
  total_iter: 15000
  warmup_iter: 200
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: mssimloss
      loss_weight: 0.2
    - type: ldlloss
      loss_weight: 1.0
    - type: ffloss
      loss_weight: 0.3
    - type: distsloss
      loss_weight: 0.25

val:
  val_enabled: true
  val_freq: 3000
  save_img: true
  tile_size: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 3000
  save_checkpoint_format: safetensors
  use_tb_logger: false
