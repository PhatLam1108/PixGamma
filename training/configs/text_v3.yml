# PixGamma Text v3 (vùng chữ): Photo v1 train tiếp trên chữ tiếng Việt có dấu, thay Photo v1 ở vùng chữ nếu thắng
# cả bộ chấm chữ lẫn quy trình chữ trong app. Text v2 (gốc Photo v7, không lật xoay) đọc tốt hơn khi chạy riêng nhưng
# thua Photo v1 trong app: app chạy 2 lượt có xoay 180 độ, mà v2 chưa từng thấy chữ xoay. v3 đi từ Photo v1 (dòng
# BHI, đọc chữ tốt nhất) và giữ lật xoay như lúc train v1 để lượt xoay trong app vẫn có ích.
# Dữ liệu như text_v2: text_vn lặp 2 lần, text5, text3, ô chi tiết sạch. Không GAN để không bịa nét chữ.
#   .venv/bin/python ../train_mps.py -opt ../configs/text_v3.yml
name: pixgamma_text_v3
scale: 4
use_amp: false
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: 0              # patch MPS: num_gpu 0 + TRAINNER_MPS=1 → chạy trên GPU Mac
manual_seed: 2910

datasets:
  train:
    name: text
    type: pairedimagedataset
    dataroot_gt: [../datasets/text_vn/train/hr, ../datasets/text_vn/train/hr, ../datasets/text5/train/hr, ../datasets/text3/train/hr, ../datasets/texture_clean/hr]
    dataroot_lq: [../datasets/text_vn/train/lr, ../datasets/text_vn/train/lr, ../datasets/text5/train/lr, ../datasets/text3/train/lr, ../datasets/texture_clean/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 6
    accum_iter: 1
    prefetch_mode: ~
  val:
    name: text_val
    type: pairedimagedataset
    dataroot_gt: [../datasets/text_vn/val/hr]
    dataroot_lq: [../datasets/text_vn/val/lr]

network_g:
  type: dat_2

path:
  pretrain_network_g: experiments/pixora_photo1/models/net_g_ema_15000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [7000]
    gamma: 0.5
  total_iter: 10000
  warmup_iter: 200
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: mssimloss
      loss_weight: 0.2
    - type: sobeledgeloss
      loss_weight: 0.6
    - type: ldlloss
      loss_weight: 1.0
    - type: ffloss
      loss_weight: 0.5
    - type: gradientvarianceloss
      loss_weight: 0.1
    - type: linedistillerloss
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 2500
  save_img: true
  tile_size: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 2500
  save_checkpoint_format: safetensors
  use_tb_logger: false
