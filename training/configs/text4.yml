# Model chữ v4: nét mảnh thẳng, không gợn. Thêm dữ liệu chữ trắng nét Regular/Light trên nền banner
# màu phẳng và nhiều ảnh nén JPEG hai lần (make_text_dataset.py --thin 0.5 --chain 0.6 --small 0.5).
# Cùng loss với v3, fine-tune tiếp từ v3. Chạy từ training/traiNNer-redux:
#   .venv/bin/python ../train_mps.py -opt ../configs/text4.yml
name: pixora_text4
scale: 4
use_amp: false          # AMP chỉ dành cho NVIDIA
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: 0              # patch MPS: num_gpu 0 + TRAINNER_MPS=1 → chạy trên GPU Mac
manual_seed: 1108

datasets:
  train:
    name: text
    type: pairedimagedataset
    dataroot_gt: [../datasets/text3/train/hr, ../datasets/text2/train/hr]
    dataroot_lq: [../datasets/text3/train/lr, ../datasets/text2/train/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 12
    accum_iter: 1
    prefetch_mode: ~
  val:
    name: text_val
    type: pairedimagedataset
    dataroot_gt: [../datasets/text3/val/hr]
    dataroot_lq: [../datasets/text3/val/lr]

network_g:
  type: realplksr
  upsampler: pixelshuffle
  layer_norm: false     # 4xNomosWebPhoto dùng GroupNorm

path:
  pretrain_network_g: experiments/pixora_text3/models/net_g_ema_latest.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [6000]
    gamma: 0.5
  total_iter: 8000
  warmup_iter: -1
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: mssimloss
      loss_weight: 0.2
    - type: sobeledgeloss        # cạnh chữ sắc, thẳng
      loss_weight: 0.6
    - type: ldlloss              # chặn vệt giả
      loss_weight: 1.0
    - type: ffloss               # giữ tần số cao thay vì làm mềm kiểu trung bình
      loss_weight: 0.5
    - type: gradientvarianceloss # độ sắc của cạnh trong từng ô 16 px
      loss_weight: 0.1
    - type: linedistillerloss    # nét chữ liền, mảnh, đúng hình
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 2000
  save_img: true
  tile_size: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 2000
  save_checkpoint_format: safetensors
  use_tb_logger: false
