# Model chữ (Text): nét chữ thẳng, mảnh, đủ dấu tiếng Việt. Dữ liệu chữ tự sinh + ảnh chụp để không quên kết cấu ảnh thật.
# Chạy từ training/traiNNer-redux:
#   .venv/bin/python ../train_mps.py -opt ../configs/text.yml
name: pixora_text
scale: 4
use_amp: false          # AMP chỉ dành cho NVIDIA
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: 0              # patch MPS: num_gpu 0 + TRAINNER_MPS=1 → chạy trên GPU Mac
manual_seed: 1108

datasets:
  train:
    name: text
    type: pairedimagedataset
    dataroot_gt: [../datasets/text/train/hr, ../datasets/trial/train/hr]
    dataroot_lq: [../datasets/text/train/lr, ../datasets/trial/train/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 8
    accum_iter: 1
    prefetch_mode: ~
  val:
    name: text_val
    type: pairedimagedataset
    dataroot_gt: [../datasets/text/val/hr]
    dataroot_lq: [../datasets/text/val/lr]

network_g:
  type: realplksr
  upsampler: pixelshuffle
  layer_norm: false     # 4xNomosWebPhoto dùng GroupNorm

path:
  pretrain_network_g: ../../tools/weights/4xNomosWebPhoto_RealPLKSR.pth
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [6000]
    gamma: 0.5
  total_iter: 8000
  warmup_iter: -1
  losses:
    - type: charbonnierloss
      loss_weight: 1.0
    - type: mssimloss
      loss_weight: 0.2
    - type: sobeledgeloss        # cạnh chữ sắc, thẳng
      loss_weight: 0.3
    - type: ldlloss              # chặn vệt giả
      loss_weight: 1.0

val:
  val_enabled: true
  val_freq: 2000
  save_img: true
  tile_size: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 2000
  save_checkpoint_format: safetensors
  use_tb_logger: false
