# PixGamma Photo v2 vòng 2: train tiếp từ photo2gan.yml (vòng 1, GAN 0,05) với GAN mạnh hơn.
# Vòng 1 ở 10.500 iter: DISTS 0,183 → 0,171, hf 0,32 → 0,54 trên ảnh nét, nhìn bằng mắt vẫn còn mềm.
# Vòng 2: GAN 0,05 → 0,15, thêm perceptual (VGG) 0,5, nới Charbonnier 1,0 → 0,5 để model dám dựng lại
# sợi lông, tóc, vân vải; giữ LDL 1,0 để chặn vệt giả. Chữ vẫn đi qua Photo v1 (không GAN) ở bước giữ chữ.
#   .venv/bin/python ../train_mps.py -opt ../configs/photo2gan_r2.yml
name: pixgamma_photo2gan_r2
scale: 4
use_amp: false
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: 0              # patch MPS: num_gpu 0 + TRAINNER_MPS=1 → chạy trên GPU Mac
manual_seed: 2310

datasets:
  train:
    name: photo
    type: pairedimagedataset
    dataroot_gt: [../datasets/photo1/train/hr, ../datasets/text_mix/hr]
    dataroot_lq: [../datasets/photo1/train/lr, ../datasets/text_mix/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 6
    accum_iter: 1
    prefetch_mode: ~
  val:
    name: photo_val
    type: pairedimagedataset
    dataroot_gt: [../datasets/photo1/val_small/hr]
    dataroot_lq: [../datasets/photo1/val_small/lr]

network_g:
  type: dat_2

network_d:
  type: unetdiscriminatorsn

path:
  pretrain_network_g: experiments/pixgamma_photo2gan/models/net_g_ema_15000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 1e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [9000]
    gamma: 0.5
  total_iter: 12000
  warmup_iter: 200
  losses:
    - type: charbonnierloss
      loss_weight: 0.5
    - type: mssimloss
      loss_weight: 0.2
    - type: ldlloss
      loss_weight: 1.0
    - type: ffloss
      loss_weight: 0.3
    - type: distsloss
      loss_weight: 0.25
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.15

val:
  val_enabled: true
  val_freq: 3000
  save_img: true
  tile_size: 0
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: 1500
  save_checkpoint_format: safetensors
  use_tb_logger: false
